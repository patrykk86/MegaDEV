# The course's replay of the plan's flows against your deployed board (gate A). Do not edit this file: the
# claim checks it is the one the starter shipped, at the commit the run used.
#
# Run it from the Actions tab (prove → Run workflow) or:
#   gh workflow run prove.yml -f url=https://<your board> -f nonce=<replayNonce> -f replay=<replay URL>
# then put the run's address in your step-2 report as runUrl.
name: prove
run-name: prove ${{ inputs.nonce }} ${{ inputs.url }}
on:
  workflow_dispatch:
    inputs:
      url:
        description: Your deployed board (https)
        required: true
      nonce:
        description: replayNonce from product's answer
        required: true
      replay:
        description: The replay's address from product's answer
        required: true
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the course's replay (pinned)
        env:
          REPLAY_URL: ${{ inputs.replay }}
        run: |
          curl -fsSL "$REPLAY_URL" -o replay.mjs
          echo "f08ed2e7977459711c6b834a2ac5a65a801516afdcc35a1733b34a7fe3fecfd4  replay.mjs" | sha256sum -c -
      - name: Install a browser
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Replay the flows
        env:
          BOARD_URL: ${{ inputs.url }}
          NONCE: ${{ inputs.nonce }}
        run: node replay.mjs "$BOARD_URL" --nonce "$NONCE"
